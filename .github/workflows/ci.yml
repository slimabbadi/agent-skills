name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: ${{ matrix.skill }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        skill: [ui-diff]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent-browser and Chromium
        shell: bash
        run: |
          npm install -g agent-browser@0.40.0
          if [ "$RUNNER_OS" = "Linux" ]; then agent-browser install --with-deps; else agent-browser install; fi
      - name: Install skill dependencies
        working-directory: skills/${{ matrix.skill }}/scripts
        run: npm install --no-audit --no-fund
      - name: Self-test
        run: node skills/${{ matrix.skill }}/scripts/selftest/selftest.mjs
  web-perf-guard:
    name: web-perf-guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test
        run: node skills/web-perf-guard/scripts/selftest/selftest.mjs
  image-to-design-v2:
    name: image-to-design-v2 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Self-test
        run: python skills/image-to-design-v2/selftest/selftest.py
